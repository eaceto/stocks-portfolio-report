# Dependabot keeps deps current with weekly PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ── npm: monorepo (root + each workspace) ─────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
      include: scope
    groups:
      # Batch all minor/patch updates per workspace so the inbox isn't noisy.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # `xlsx` is pinned to a tarball from the SheetJS CDN (the npm registry
      # version was deprecated). Dependabot can't resolve newer versions for
      # tarball URLs — managed manually.
      - dependency-name: "xlsx"

  - package-ecosystem: npm
    directory: /packages/engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(engine)
      include: scope
    ignore:
      - dependency-name: "xlsx"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      next:
        patterns:
          - "next"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
