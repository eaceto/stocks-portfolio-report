name: 🐛 Bug report
description: Algo no funciona como debería (cálculo erróneo, fallo de parseo, UI rota…)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Antes de empezar:

        - **Nunca incluyas datos personales reales** (IBAN completo, DNI, importes que te identifiquen). Si necesitas adjuntar un fragmento de extracto, **anonimízalo** o describe el problema con cifras inventadas equivalentes.
        - Si es un fallo de **seguridad** no abras un issue aquí — sigue `SECURITY.md`.

  - type: textarea
    id: what
    attributes:
      label: ¿Qué está pasando?
      description: Describe el comportamiento observado vs el esperado.
      placeholder: |
        - Esperaba: …
        - Vi: …
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Subo un .xlsx con N operaciones de …
        2. Activo / desactivo el toggle …
        3. Observo que …
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Navegador y SO
      placeholder: "Firefox 140 · macOS 26"

  - type: dropdown
    id: scope
    attributes:
      label: ¿Dónde crees que está el problema?
      options:
        - Parser (lectura del XLS/CSV)
        - Motor FIFO / regla 2m / carryforward
        - UI (visualización, tabs, exportación)
        - PWA / instalación / offline
        - No estoy seguro
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Notas adicionales
      description: Stack trace de la consola, screenshots, lo que sea útil. Recuerda anonimizar.
