name: CI

# Runs on every push and pull-request. Vercel's GitHub integration handles
# preview and production deployments separately — this workflow only validates
# the codebase (typecheck + tests + a production build that mirrors what
# Vercel will run).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (engine + web)
        run: npm run typecheck

      - name: Run engine tests
        run: npm test

      - name: Engine coverage report
        run: npm run coverage
        continue-on-error: true

      - name: Build static export (apps/web)
        run: npm run build

      - name: Upload static export as artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 7
          if-no-files-found: error
