<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant: same artwork as icon.svg, but scaled down to fit inside
  the recommended ~80% safe area so the launcher can crop the icon to any
  shape (circle, squircle, rounded square) without clipping the table.
  The background gradient still bleeds to the full 512×512 frame.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Análisis de operaciones de cartera de valores">
  <title>Análisis de operaciones de cartera de valores</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6b56"/>
      <stop offset="100%" stop-color="#2eb39a"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11876c"/>
      <stop offset="100%" stop-color="#0d6b56"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClipMask">
      <rect x="138" y="156" width="236" height="220" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background bleeds the full frame -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="220" fill="url(#topGloss)"/>

  <!-- Card scaled inside the safe area (~ 80% of 512 = 410 centered) -->
  <g clip-path="url(#cardClipMask)">
    <rect x="138" y="156" width="236" height="220" fill="#fbf8f1"/>
    <rect x="138" y="156" width="236" height="44" fill="url(#hdr)"/>

    <!-- Header labels -->
    <rect x="156" y="172" width="44" height="8" rx="4" fill="#ffffff" opacity="0.92"/>
    <rect x="216" y="172" width="26" height="8" rx="4" fill="#ffffff" opacity="0.72"/>
    <rect x="262" y="172" width="32" height="8" rx="4" fill="#ffffff" opacity="0.72"/>
    <rect x="312" y="172" width="44" height="8" rx="4" fill="#ffffff" opacity="0.92"/>

    <!-- 4 data rows -->
    <rect x="156" y="212" width="56" height="10" rx="3" fill="#15181d"/>
    <rect x="216" y="214" width="28" height="8" rx="3" fill="#5a626d"/>
    <rect x="262" y="214" width="32" height="8" rx="3" fill="#5a626d"/>
    <rect x="310" y="212" width="46" height="10" rx="3" fill="#11876c"/>

    <rect x="156" y="240" width="48" height="10" rx="3" fill="#15181d"/>
    <rect x="216" y="242" width="24" height="8" rx="3" fill="#5a626d"/>
    <rect x="262" y="242" width="30" height="8" rx="3" fill="#5a626d"/>
    <rect x="316" y="240" width="40" height="10" rx="3" fill="#c0382a"/>

    <rect x="156" y="268" width="62" height="10" rx="3" fill="#15181d"/>
    <rect x="216" y="270" width="30" height="8" rx="3" fill="#5a626d"/>
    <rect x="262" y="270" width="32" height="8" rx="3" fill="#5a626d"/>
    <rect x="312" y="268" width="44" height="10" rx="3" fill="#11876c"/>

    <rect x="156" y="296" width="52" height="10" rx="3" fill="#15181d"/>
    <rect x="216" y="298" width="26" height="8" rx="3" fill="#5a626d"/>
    <rect x="262" y="298" width="34" height="8" rx="3" fill="#5a626d"/>
    <rect x="312" y="296" width="44" height="10" rx="3" fill="#11876c"/>

    <!-- Total band -->
    <rect x="138" y="332" width="236" height="44" fill="#eef6f3"/>
    <rect x="156" y="344" width="40" height="12" rx="3" fill="#15181d"/>
    <rect x="294" y="342" width="62" height="16" rx="4" fill="url(#hdr)"/>
  </g>
</svg>
