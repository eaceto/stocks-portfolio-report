<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stocks Portfolio Report">
  <title>Stocks Portfolio Report</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6b56"/>
      <stop offset="100%" stop-color="#2eb39a"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11876c"/>
      <stop offset="100%" stop-color="#0d6b56"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="80" y="100" width="352" height="312" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Soft top gloss for depth -->
  <rect width="512" height="220" rx="96" fill="url(#topGloss)"/>

  <!-- Card (white surface clipped to rounded rectangle) -->
  <g clip-path="url(#cardClip)">
    <rect x="80" y="100" width="352" height="312" fill="#fbf8f1"/>
    <!-- Header bar -->
    <rect x="80" y="100" width="352" height="60" fill="url(#hdr)"/>

    <!-- Header column labels (short white bars) -->
    <rect x="108" y="124" width="62" height="10" rx="5" fill="#ffffff" opacity="0.92"/>
    <rect x="208" y="124" width="36" height="10" rx="5" fill="#ffffff" opacity="0.72"/>
    <rect x="278" y="124" width="42" height="10" rx="5" fill="#ffffff" opacity="0.72"/>
    <rect x="350" y="124" width="56" height="10" rx="5" fill="#ffffff" opacity="0.92"/>

    <!-- Row separators (very subtle) -->
    <line x1="92"  y1="200" x2="420" y2="200" stroke="#e6dfd1" stroke-width="1"/>
    <line x1="92"  y1="244" x2="420" y2="244" stroke="#e6dfd1" stroke-width="1"/>
    <line x1="92"  y1="288" x2="420" y2="288" stroke="#e6dfd1" stroke-width="1"/>
    <line x1="92"  y1="332" x2="420" y2="332" stroke="#e6dfd1" stroke-width="1"/>

    <!-- Row 1 -->
    <rect x="108" y="178" width="76" height="14" rx="3" fill="#15181d"/>
    <rect x="208" y="180" width="40" height="10" rx="3" fill="#5a626d"/>
    <rect x="278" y="180" width="48" height="10" rx="3" fill="#5a626d"/>
    <rect x="346" y="178" width="62" height="14" rx="3" fill="#11876c"/>

    <!-- Row 2 -->
    <rect x="108" y="222" width="66" height="14" rx="3" fill="#15181d"/>
    <rect x="208" y="224" width="34" height="10" rx="3" fill="#5a626d"/>
    <rect x="278" y="224" width="44" height="10" rx="3" fill="#5a626d"/>
    <rect x="356" y="222" width="52" height="14" rx="3" fill="#c0382a"/>

    <!-- Row 3 -->
    <rect x="108" y="266" width="88" height="14" rx="3" fill="#15181d"/>
    <rect x="208" y="268" width="42" height="10" rx="3" fill="#5a626d"/>
    <rect x="278" y="268" width="46" height="10" rx="3" fill="#5a626d"/>
    <rect x="350" y="266" width="58" height="14" rx="3" fill="#11876c"/>

    <!-- Row 4 -->
    <rect x="108" y="310" width="72" height="14" rx="3" fill="#15181d"/>
    <rect x="208" y="312" width="38" height="10" rx="3" fill="#5a626d"/>
    <rect x="278" y="312" width="50" height="10" rx="3" fill="#5a626d"/>
    <rect x="350" y="310" width="58" height="14" rx="3" fill="#11876c"/>

    <!-- Total band -->
    <rect x="80" y="356" width="352" height="56" fill="#eef6f3"/>
    <rect x="108" y="372" width="56" height="14" rx="3" fill="#15181d"/>
    <rect x="320" y="370" width="92" height="18" rx="4" fill="url(#hdr)"/>
  </g>
</svg>
